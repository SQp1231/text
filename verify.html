<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASTER BOT — توثيق</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1e1f22;color:#f2f3f5;font-family:Tahoma,"Segoe UI",sans-serif}.c{width:min(92vw,520px);background:#2b2d31;border-radius:16px;padding:28px;text-align:center;box-shadow:0 10px 40px #0008}
h1{font-size:22px;margin:0 0 8px}p{color:#b5bac1;line-height:1.8;margin:6px 0}code{display:block;direction:ltr;margin:16px 0;padding:14px;border-radius:10px;background:#1e1f22;font-size:18px;word-break:break-all;color:#fff}
button{border:0;border-radius:10px;padding:12px 22px;background:#5865f2;color:#fff;font-size:16px;cursor:pointer}button.ok{background:#248046}</style></head>
<body><div class="c"><h1>✅ تمت الموافقة</h1><p>انسخ الكود وارجع لديسكورد، واضغط زر «أدخل الكود» والصقه.</p><code id="k">—</code><button id="b">نسخ الكود</button><p style="font-size:13px;margin-top:16px">MASTER BOT</p></div>
<script>var k=new URLSearchParams(location.search).get('code')||'';document.getElementById('k').textContent=k||'ما فيه كود — ارجع واضغط «توثيق» مرة ثانية';document.getElementById('b').onclick=function(){navigator.clipboard.writeText(k).then(function(){var b=document.getElementById('b');b.textContent='تم النسخ ✓';b.className='ok';});};</script></body></html>
